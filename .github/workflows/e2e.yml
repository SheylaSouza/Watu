name: Watu E2E

on:
  push:
  pull_request:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create local test environment
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Run static quality gates
        run: npm run quality

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Start MySQL, Flyway and WireMock
        run: docker compose up -d --wait

      - name: Run UI, database and API suites sequentially
        run: npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright reports and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: watu-playwright-reports
          path: |
            reports/
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop test infrastructure
        if: always()
        run: docker compose down -v
