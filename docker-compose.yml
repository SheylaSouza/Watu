services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qa_senior}
      MYSQL_USER: ${MYSQL_USER:-qa_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qa_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  flyway:
    image: flyway/flyway:13.7.0-alpine
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./database/migrations:/flyway/sql:ro
    command:
      - -url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-qa_senior}?allowPublicKeyRetrieval=true&useSSL=false
      - -user=${MYSQL_USER:-qa_user}
      - -password=${MYSQL_PASSWORD:-qa_password}
      - -connectRetries=60
      - migrate
    restart: 'no'

  wiremock:
    image: wiremock/wiremock:3.13.2
    depends_on:
      flyway:
        condition: service_completed_successfully
    ports:
      - '${WIREMOCK_PORT:-8080}:8080'
    volumes:
      - ./wiremock:/home/wiremock:ro
    command:
      - --global-response-templating
      - --verbose

volumes:
  mysql-data:
